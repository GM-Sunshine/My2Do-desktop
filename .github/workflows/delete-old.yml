name: Delete old releases (one-off)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/delete-old.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases + tags (v0.1.0 through v0.1.9)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for t in v0.1.0 v0.1.1 v0.1.2 v0.1.3 v0.1.4 v0.1.5 v0.1.6 v0.1.7 v0.1.8 v0.1.9; do
            echo "deleting $t"
            gh release delete "$t" -R "${{ github.repository }}" --yes --cleanup-tag || echo "  (skip $t — not found)"
          done
