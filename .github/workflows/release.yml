name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Publishes native installers + the latest*.yml update feed to the GitHub Release.
      # Signing later: add CSC_LINK/CSC_KEY_PASSWORD (win/mac) + APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID.
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-builder uploads to a DRAFT release; flip it live once all platforms are in.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release notes = the tag's commit message, minus any tooling trailers
          # (co-author lines and "<Tool>-Session: <url>" lines).
          git log -1 --pretty=%B | grep -viE '^Co-Authored-By:|^[A-Za-z]+-Session: https?://' > release-notes.md
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest --notes-file release-notes.md
