name: Clean release notes (one-off)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-notes.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set clean release notes from each tag's commit message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for t in v0.1.7 v0.1.8 v0.1.9; do
            echo "cleaning $t"
            git log -1 --pretty=%B "$t" \
              | grep -viE '^Co-Authored-By:|^[A-Za-z]+-Session: https?://' > notes.md
            gh release edit "$t" -R "${{ github.repository }}" --notes-file notes.md
          done
