name: Clean release notes (one-off)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-notes.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Strip tooling trailers from published release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for t in v0.1.7 v0.1.8 v0.1.9; do
            echo "cleaning $t"
            gh release view "$t" -R "${{ github.repository }}" --json body -q .body \
              | grep -viE '^Co-Authored-By:|^[A-Za-z]+-Session: https?://' > notes.md || true
            gh release edit "$t" -R "${{ github.repository }}" --notes-file notes.md
          done
